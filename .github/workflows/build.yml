
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: ["**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unpack project
        run: unzip -o capsmith-android.zip
      - name: Build
        working-directory: capsmith-android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: capsmith-apk
          path: capsmith-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: capsmith-android/app/build/outputs/apk/debug/app-debug.apk
